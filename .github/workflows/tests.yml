name: Pull request checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Python unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run python -m unittest discover -s tests -v

  container-smoke:
    name: Container startup and authentication
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Build smoke-test image
        run: docker build --build-arg "REVISION=$GITHUB_SHA" -t raspberry-mcp:ci .
      - name: Verify authenticated MCP readiness
        run: |
          export RASPBERRY_MCP_TOKEN="$(openssl rand -hex 32)"
          docker run --detach --name raspberry-mcp-ci --env RASPBERRY_MCP_TOKEN raspberry-mcp:ci
          for attempt in $(seq 1 20); do
            if docker exec raspberry-mcp-ci python -m raspberry_mcp.healthcheck; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Verify unauthenticated requests are rejected
        run: |
          docker exec raspberry-mcp-ci python - <<'PY'
          import urllib.error
          import urllib.request

          request = urllib.request.Request("http://127.0.0.1:8000/mcp")
          try:
              urllib.request.urlopen(request, timeout=5)
          except urllib.error.HTTPError as error:
              if error.code != 401:
                  raise SystemExit(f"expected HTTP 401, got HTTP {error.code}")
          else:
              raise SystemExit("expected unauthenticated request to return HTTP 401")
          PY
      - name: Stop smoke-test container
        if: always()
        run: docker rm -f raspberry-mcp-ci || true
